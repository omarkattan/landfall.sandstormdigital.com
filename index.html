<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Landfall</title>
<style>
  :root {
    --bg: #0e1218;
    --panel: #161c26;
    --panel-2: #1b2230;
    --line: #252d3a;
    --text: #dde3ec;
    --muted: #7b8698;
    --sand: #d9a441;
    --ok: #4ec9b0;
    --warn: #e0a458;
    --err: #e0655c;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }

  a { color: var(--sand); }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top {
    display: flex; align-items: baseline; gap: 14px;
    flex-wrap: wrap; margin-bottom: 6px;
  }
  header.top h1 {
    font-size: 17px; margin: 0; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  header.top h1 span { color: var(--sand); }
  .sa {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    word-break: break-all;
  }
  .who { font-family: var(--mono); font-size: 11px; color: var(--sand); }
  .appfoot { border-top: 1px solid var(--line); margin-top: 40px; padding: 22px 0 8px; }
  .appfoot p { margin: 0; font-family: var(--mono); font-size: 11px; color: var(--muted); }

  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 26px; }
  .pill {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px; padding: 8px 12px; min-width: 108px;
  }
  .pill b { display: block; font-family: var(--mono); font-size: 17px; font-weight: 600; }
  .pill i {
    font-style: normal; font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.1em;
  }

  section { margin-bottom: 34px; }
  section > h2 {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 10px; font-weight: 600;
    border-bottom: 1px solid var(--line); padding-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }

  button {
    font-family: var(--sans); font-size: 12px; cursor: pointer;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 3px; padding: 6px 11px;
  }
  button:hover { border-color: var(--sand); }
  button:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.primary { background: var(--sand); color: #1a1206; border-color: var(--sand); font-weight: 600; }
  .btnrow { display: flex; gap: 7px; flex-wrap: wrap; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted); font-weight: 600;
    padding: 7px 9px; border-bottom: 1px solid var(--line);
  }
  td { padding: 9px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.off td { opacity: 0.45; }
  td.mono, .mono { font-family: var(--mono); font-size: 12px; }
  td.num { text-align: right; font-family: var(--mono); }

  .tag {
    font-family: var(--mono); font-size: 10px; padding: 2px 6px;
    border-radius: 2px; border: 1px solid var(--line); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .tag.core { color: var(--sand); border-color: #4a3a1c; }
  .tag.spam { color: var(--err); border-color: #4a2622; }
  .tag.on { color: var(--ok); border-color: #1f4740; }

  /* Signature: rollout spans on a shared 18-month axis */
  .track {
    position: relative; height: 8px; background: var(--panel-2);
    border-radius: 2px; overflow: hidden; min-width: 120px;
  }
  .track.big { height: 12px; margin-bottom: 9px; }
  .fill {
    height: 100%; background: var(--sand); border-radius: 2px;
    transition: width .4s ease;
  }
  .queue { margin-bottom: 14px; }
  .legend {
    display: flex; flex-wrap: wrap; gap: 16px;
    font-size: 12px; color: var(--muted); font-family: var(--mono);
  }
  .legend b { color: var(--text); }
  .legend .ok { color: var(--ok); }
  .legend .err { color: var(--err); }
  .sub {
    font-size: 10px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--muted); margin: 20px 0 6px;
  }

  select {
    font-family: var(--sans); font-size: 12px; cursor: pointer;
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 3px; padding: 6px 9px;
  }
  select:hover { border-color: var(--sand); }
  select:focus-visible { outline: 2px solid var(--sand); outline-offset: 2px; }

  tr.seg { cursor: pointer; }
  tr.seg:hover td { background: var(--panel); }
  tr.seg.sel td { background: var(--panel-2); }
  tr.seg.sel td:first-child { box-shadow: inset 3px 0 0 var(--sand); }

  .delta { font-family: var(--mono); text-align: right; }
  .delta.down { color: var(--err); }
  .delta.up { color: var(--ok); }
  .delta.flat { color: var(--muted); }

  #chart svg { width: 100%; height: auto; display: block; }
  .chartnote { font-size: 12px; color: var(--muted); margin: 8px 0 0; line-height: 1.6; }
  .chartnote b { color: var(--text); font-family: var(--mono); }

  /* Findings: the reading of the data, given more room than the data itself */
  .headline {
    font-size: 19px; line-height: 1.45; margin: 4px 0 10px; font-weight: 500;
    letter-spacing: -0.01em;
  }
  .headline .down { color: var(--err); }
  .headline .up { color: var(--ok); }
  .detail { font-size: 14px; line-height: 1.65; color: var(--muted); margin: 0 0 18px; max-width: 68ch; }
  .detail b { color: var(--text); }

  .callout {
    background: var(--panel); border: 1px solid var(--line);
    border-left: 3px solid var(--sand);
    border-radius: 3px; padding: 13px 16px; margin: 0 0 20px; max-width: 78ch;
  }
  .callout h3 {
    margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--sand);
    letter-spacing: 0;
  }
  .callout p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }

  .recs { display: grid; gap: 10px; margin-top: 6px; }
  .rec {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px; padding: 13px 16px;
  }
  .rec.high { border-left: 3px solid var(--err); }
  .rec.medium { border-left: 3px solid var(--warn); }
  .rec.low { border-left: 3px solid var(--line); }
  .rec h4 {
    margin: 0 0 5px; font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  }
  .rec p { margin: 0; font-size: 13px; line-height: 1.65; color: var(--muted); max-width: 78ch; }
  .rec .value {
    font-family: var(--mono); font-size: 11px; color: var(--sand);
    font-weight: 400; letter-spacing: 0;
  }
  .items { margin: 11px 0 0; border-top: 1px solid var(--line); }
  .item {
    display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
    padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px;
  }
  .item:last-child { border-bottom: 0; padding-bottom: 0; }
  .item .k { font-family: var(--mono); color: var(--text); flex: 1 1 240px; word-break: break-word; }
  .item .d { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .item .v { font-family: var(--mono); color: var(--sand); margin-left: auto; white-space: nowrap; }

  .tag.hit { color: var(--err); border-color: #4a2622; }
  .tag.gained { color: var(--ok); border-color: #1f4740; }
  .tag.high { color: var(--err); border-color: #4a2622; }
  .tag.medium { color: var(--warn); border-color: #4a3a1c; }
  .span {
    position: absolute; top: 0; bottom: 0;
    background: var(--sand); opacity: 0.85; border-radius: 2px; min-width: 3px;
  }
  .span.spam { background: var(--err); }
  .span.open { background: repeating-linear-gradient(90deg, var(--warn) 0 4px, transparent 4px 8px); }

  .empty { color: var(--muted); padding: 16px 0; }
  .err { color: var(--err); font-family: var(--mono); font-size: 12px; }

  input[type=text], input[type=password], input[type=date], textarea {
    width: 100%; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); border-radius: 3px; padding: 8px 10px;
    font-family: var(--mono); font-size: 13px; margin-bottom: 9px;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--sand); }
  form.manual { display: none; margin-top: 14px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; }
  form.manual.open { display: block; }
  form.manual label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 3px; }

  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--sand);
    padding: 9px 16px; border-radius: 3px; font-family: var(--mono);
    font-size: 12px; opacity: 0; pointer-events: none; transition: opacity .18s;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 640px) {
    .hide-sm { display: none; }
    .wrap { padding: 18px 13px 60px; }
  }
</style>
</head>
<body>

<div class="wrap" id="app" hidden>
  <header class="top">
    <h1>Land<span>fall</span></h1>
    <span class="sa" id="sa"></span>
    <span class="who" id="who"></span>
    <button id="signout" style="margin-left:auto">Sign out</button>
  </header>

  <div class="pills" id="pills"></div>

  <section id="oppSection">
    <h2>What to work on</h2>
    <div id="opps"><p class="empty">Loading.</p></div>
  </section>

  <section id="findingsSection">
    <h2>
      What the updates did
      <span class="btnrow">
        <select id="findUpdate"></select>
      </span>
    </h2>
    <div id="findings"><p class="empty">Loading.</p></div>
  </section>

  <section id="peopleSection" hidden>
    <h2>People</h2>
    <div id="people"></div>
  </section>

  <section>
    <h2>
      Properties
      <span class="btnrow">
        <button id="syncProps">Find properties</button>
        <button id="refreshAll">Queue refresh</button>
      </span>
    </h2>
    <div id="props"></div>
  </section>

  <section>
    <h2>
      Queue
      <span class="btnrow">
        <button id="retryJobs">Retry failed</button>
        <button id="runTick">Run a batch now</button>
      </span>
    </h2>
    <div id="jobs"></div>
  </section>

  <section>
    <h2>
      Segments
      <span class="btnrow">
        <select id="segMetric">
          <option value="clicks">Clicks</option>
          <option value="impressions">Impressions</option>
        </select>
        <select id="segDays">
          <option value="28">Last 28 days</option>
          <option value="14">Last 14 days</option>
          <option value="56">Last 56 days</option>
          <option value="90">Last 90 days</option>
        </select>
        <button id="buildSegs">Build segments</button>
      </span>
    </h2>
    <div id="segs"></div>
    <div id="chartWrap" hidden>
      <p class="sub" id="chartTitle"></p>
      <div id="chart"></div>
      <p class="chartnote" id="chartNote"></p>
    </div>
  </section>

  <section>
    <h2>
      Google ranking updates
      <span class="btnrow">
        <button id="syncUpd">Sync from Google</button>
        <button id="toggleManual">Add by hand</button>
      </span>
    </h2>
    <form class="manual" id="manualForm">
      <label for="mName">Name</label>
      <input type="text" id="mName" placeholder="August 2026 core update">
      <label for="mBegan">Rollout start</label>
      <input type="date" id="mBegan">
      <label for="mEnded">Rollout end (optional)</label>
      <input type="date" id="mEnded">
      <label for="mUrl">Source link (optional)</label>
      <input type="text" id="mUrl" placeholder="https://status.search.google.com/...">
      <button class="primary" id="saveManual" type="button">Save update</button>
    </form>
    <div id="upd"></div>
  </section>

  <footer class="appfoot">
    <p>Copyright 2026 Landfall - Another
      <a href="https://sandstormdigital.com" rel="noopener">Sandstorm Digital</a> Production</p>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let toastTimer;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), Math.min(3200 + msg.length * 45, 9000));
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function busy(btn, label, fn) {
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = label;
  return Promise.resolve(fn())
    .catch((e) => toast(e.message))
    .finally(() => { btn.disabled = false; btn.textContent = original; });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function shortDate(v) {
  if (!v) return '';
  return new Date(v).toISOString().slice(0, 10);
}

async function loadStatus() {
  const s = await api('/api/status');
  $('sa').textContent = s.serviceAccount || 'No service account configured';

  const j = s.jobs || {};
  const m = s.metrics || {};
  const cells = [
    ['Active properties', `${s.properties.active}/${s.properties.total}`],
    ['Rows stored', Number(m.n || 0).toLocaleString()],
    ['Coverage', m.first_date ? `${shortDate(m.first_date)} to ${shortDate(m.last_date)}` : 'none yet'],
    ['Queued', j.queued || 0],
    ['Failed', j.error || 0],
    ['Updates', s.updates || 0]
  ];
  $('pills').innerHTML = cells.map(([label, val]) =>
    `<div class="pill"><b>${esc(val)}</b><i>${esc(label)}</i></div>`).join('');

  if (s.updatesLastError) toast(`Update sync issue: ${s.updatesLastError}`);
}

async function loadProps() {
  const rows = await api('/api/properties');

  // Segments operate on one property. With a single client that is simply the
  // active one; a picker belongs here once there are several.
  const active = rows.find((p) => p.active);
  seg.propertyId = active ? active.id : null;

  if (!rows.length) {
    $('props').innerHTML = '<p class="empty">No properties yet. Choose "Find properties" to pull everything the service account can read.</p>';
    return;
  }
  $('props').innerHTML = `<table>
    <thead><tr>
      <th>Property</th><th class="hide-sm">Type</th><th class="hide-sm">Latest data</th>
      <th class="num">Queued</th><th class="num hide-sm">Failed</th><th></th>
    </tr></thead>
    <tbody>${rows.map((p) => `
      <tr class="${p.active ? '' : 'off'}">
        <td class="mono">${esc(p.label || p.site_url)}</td>
        <td class="hide-sm"><span class="tag">${p.property_type === 'domain' ? 'domain' : 'prefix'}</span></td>
        <td class="mono hide-sm">${p.last_date ? shortDate(p.last_date) : '-'}</td>
        <td class="num">${p.queued}</td>
        <td class="num hide-sm">${p.errored ? `<span class="err">${p.errored}</span>` : '0'}</td>
        <td><span class="btnrow">
          <button data-toggle="${p.id}">${p.active ? 'Pause' : 'Activate'}</button>
          <button data-backfill="${p.id}">Backfill</button>
        </span></td>
      </tr>`).join('')}</tbody></table>`;
}

async function loadJobs() {
  const d = await api('/api/jobs');
  const c = d.counts;
  const settled = c.done + c.error;
  const pct = d.total ? Math.round((settled / d.total) * 100) : 0;

  if (!d.total) {
    $('jobs').innerHTML = '<p class="empty">No work queued yet. Choose Backfill on a property to queue its history.</p>';
    return;
  }

  let html = `<div class="queue">
    <div class="track big"><div class="fill" style="width:${pct}%"></div></div>
    <div class="legend">
      <span><b>${settled.toLocaleString()}</b> of ${d.total.toLocaleString()} jobs complete</span>
      <span>${c.queued.toLocaleString()} waiting</span>
      ${c.running ? `<span class="ok">${c.running} running now</span>` : ''}
      ${c.error ? `<span class="err">${c.error} failed</span>` : ''}
    </div>
  </div>`;

  if (!c.running && c.queued) {
    html += `<p class="empty">Nothing is running. The queue only advances when you
      choose <b>Run a batch now</b>, or when the ingest cron calls the app.</p>`;
  }

  if (d.active.length) {
    html += `<table>
      <thead><tr><th>Property</th><th>Slice</th><th class="hide-sm">Window</th><th>State</th><th>Detail</th></tr></thead>
      <tbody>${d.active.map((j) => `
        <tr>
          <td class="mono">${esc(j.site_url)}</td>
          <td class="mono">${esc(j.slice)}</td>
          <td class="mono hide-sm">${shortDate(j.start_date)} to ${shortDate(j.end_date)}</td>
          <td><span class="tag ${j.status === 'error' ? 'spam' : 'on'}">${esc(j.status)}</span></td>
          <td class="err">${esc(j.error || '')}</td>
        </tr>`).join('')}</tbody></table>`;
  }

  if (d.recent.length) {
    html += `<p class="sub">Most recently finished</p><table>
      <tbody>${d.recent.map((j) => `
        <tr>
          <td class="mono">${esc(j.site_url)}</td>
          <td class="mono">${esc(j.slice)}</td>
          <td class="mono hide-sm">${shortDate(j.start_date)} to ${shortDate(j.end_date)}</td>
          <td class="num">${Number(j.rows_written || 0).toLocaleString()} rows</td>
        </tr>`).join('')}</tbody></table>`;
  } else if (d.next.length) {
    html += `<p class="sub">Next up</p><table>
      <tbody>${d.next.map((j) => `
        <tr>
          <td class="mono">${esc(j.site_url)}</td>
          <td class="mono">${esc(j.slice)}</td>
          <td class="mono hide-sm">${shortDate(j.start_date)} to ${shortDate(j.end_date)}</td>
        </tr>`).join('')}</tbody></table>`;
  }

  $('jobs').innerHTML = html;
}

async function loadUpdates() {
  const rows = await api('/api/updates');
  if (!rows.length) {
    $('upd').innerHTML = '<p class="empty">No updates stored. Choose "Sync from Google" to pull the ranking incident history.</p>';
    return;
  }

  const now = Date.now();
  const axisStart = now - 1000 * 60 * 60 * 24 * 548; // 18 months
  const axisSpan = now - axisStart;

  $('upd').innerHTML = `<table>
    <thead><tr><th>Update</th><th class="hide-sm">Type</th><th>Rollout</th><th class="hide-sm" style="width:34%">Timeline</th></tr></thead>
    <tbody>${rows.map((u) => {
      const b = u.began_at ? new Date(u.began_at).getTime() : null;
      const e = u.ended_at ? new Date(u.ended_at).getTime() : null;
      let bar = '';
      if (b && b > axisStart) {
        const left = ((b - axisStart) / axisSpan) * 100;
        const right = (((e || now) - axisStart) / axisSpan) * 100;
        const cls = (u.update_type === 'spam' ? ' spam' : '') + (e ? '' : ' open');
        bar = `<div class="span${cls}" style="left:${left.toFixed(2)}%;width:${Math.max(right - left, 0.4).toFixed(2)}%"></div>`;
      }
      const days = b ? Math.round(((e || now) - b) / 86400000) : null;
      return `<tr>
        <td>${u.url ? `<a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.name)}</a>` : esc(u.name)}</td>
        <td class="hide-sm"><span class="tag ${esc(u.update_type)}">${esc(u.update_type.replace(/_/g, ' '))}</span></td>
        <td class="mono">${shortDate(u.began_at) || '-'}${days != null ? ` &middot; ${days}d${u.ended_at ? '' : ' open'}` : ''}</td>
        <td class="hide-sm"><div class="track">${bar}</div></td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

// -------------------------------------------------------------- people

async function loadPeople() {
  if ($('peopleSection').hidden) return;
  const d = await api('/api/people');

  const pending = d.users.filter((u) => u.status === 'pending');
  let html = '';

  if (pending.length) {
    html += `<p class="sub">Waiting for approval</p><table><tbody>${pending.map((u) => `
      <tr>
        <td class="mono">${esc(u.email)}</td>
        <td>${esc(u.name || '')}</td>
        <td class="mono hide-sm">${shortDate(u.created_at)}</td>
        <td><span class="btnrow">
          <button data-let="${u.id}">Let in</button>
          <button data-block="${u.id}">Block</button>
        </span></td>
      </tr>`).join('')}</tbody></table>`;
  }

  const active = d.users.filter((u) => u.status === 'active');
  if (active.length) {
    html += `<p class="sub">Accounts</p><table><tbody>${active.map((u) => `
      <tr>
        <td class="mono">${esc(u.email)}</td>
        <td>${esc(u.name || '')}</td>
        <td class="hide-sm"><span class="tag">${esc(u.role)}</span></td>
        <td class="mono hide-sm">${u.last_login_at ? shortDate(u.last_login_at) : 'never'}</td>
        <td>${u.role === 'admin' ? '' : `<button data-block="${u.id}">Block</button>`}</td>
      </tr>`).join('')}</tbody></table>`;
  }

  if (d.waitlist.length) {
    html += `<p class="sub">Requested access (${d.waitlist.length})</p><table><tbody>${d.waitlist.slice(0, 20).map((w) => `
      <tr>
        <td class="mono">${esc(w.email)}</td>
        <td>${esc(w.name || '')}</td>
        <td class="hide-sm">${esc(w.company || '')}</td>
        <td class="mono hide-sm">${esc(w.website || '')}</td>
        <td class="mono hide-sm">${shortDate(w.created_at)}</td>
      </tr>`).join('')}</tbody></table>`;
  }

  $('people').innerHTML = html || '<p class="empty">Nobody has signed up or requested access yet.</p>';
}

$('people').addEventListener('click', (ev) => {
  const t = ev.target.closest('button');
  if (!t) return;
  const id = t.dataset.let || t.dataset.block;
  if (!id) return;
  const status = t.dataset.let ? 'active' : 'blocked';
  busy(t, '...', async () => {
    const r = await api(`/api/people/${id}/status`, {
      method: 'POST', body: JSON.stringify({ status })
    });
    toast(`${r.email} is now ${r.status}`);
    await loadPeople();
  });
});

// -------------------------------------------------------- opportunities

async function loadOpportunities() {
  if (!seg.propertyId) {
    $('opps').innerHTML = '<p class="empty">Activate a property first.</p>';
    return;
  }

  const d = await api(`/api/opportunities?property_id=${seg.propertyId}`);

  if (d.status !== 'ok') {
    $('opps').innerHTML = `<p class="empty">${esc(d.message || 'Nothing to analyse yet.')}</p>`;
    return;
  }

  if (!d.actions.length) {
    $('opps').innerHTML = `<p class="empty">Nothing stands out in the last 28 days. No queries
      within reach of the top, no pages underperforming their position, and no significant
      decline or growth against the previous 28 days. That is a stable site, not a broken report.</p>`;
    return;
  }

  const html = `<p class="detail">Comparing <b>${d.window.from}</b> to <b>${d.window.to}</b>
      against the 28 days before it${d.totals.brandedShare != null
        ? `. Branded queries are <b>${d.totals.brandedShare.toFixed(0)}%</b> of clicks.` : '.'}</p>
    <div class="recs">${d.actions.map((a) => `
      <div class="rec ${esc(a.priority)}">
        <h4>${esc(a.title)}
          <span class="tag ${esc(a.priority)}">${esc(a.priority)}</span>
          ${a.value ? `<span class="value">${esc(a.value)}</span>` : ''}
        </h4>
        <p>${esc(a.body)}</p>
        ${a.items.length ? `<div class="items">${a.items.map((it) => `
          <div class="item">
            <span class="k">${esc(it.label)}</span>
            <span class="d">${esc(it.detail)}</span>
            <span class="v">${esc(it.value)}</span>
          </div>`).join('')}</div>` : ''}
      </div>`).join('')}</div>`;

  $('opps').innerHTML = html;
}

// ------------------------------------------------------------- findings

async function loadUpdateList() {
  if (!seg.propertyId) return;
  const d = await api(`/api/findings/updates?property_id=${seg.propertyId}`);
  const sel = $('findUpdate');
  const keep = sel.value;

  if (!d.rows.length) {
    sel.innerHTML = '<option>No updates inside your data range</option>';
    $('findings').innerHTML = `<p class="empty">No ranking updates fall inside your stored date range
      (${d.coverage ? `${shortDate(d.coverage.first)} to ${shortDate(d.coverage.last)}` : 'no data yet'}).
      Choose <b>Sync from Google</b> below to pull the update history.</p>`;
    return;
  }

  sel.innerHTML = d.rows.map((u) =>
    `<option value="${esc(u.id)}">${esc(u.name)}</option>`).join('');
  if (keep && d.rows.some((u) => u.id === keep)) sel.value = keep;

  await loadFindings(sel.value);
}

function verdictTag(v) {
  if (v === 'hit') return '<span class="tag hit">hit</span>';
  if (v === 'gained') return '<span class="tag gained">gained</span>';
  return '<span class="tag">steady</span>';
}

async function loadFindings(updateId) {
  if (!updateId || !seg.propertyId) return;
  $('findings').innerHTML = '<p class="empty">Reading the data.</p>';

  const d = await api(`/api/findings?property_id=${seg.propertyId}&update_id=${encodeURIComponent(updateId)}`);

  if (d.status !== 'assessed') {
    $('findings').innerHTML = `<p class="empty">${esc(d.message || 'This update cannot be assessed yet.')}</p>`;
    return;
  }

  // The headline number is coloured so the direction reads before the words do.
  const headline = esc(d.headline).replace(/(-\d+%)/g, '<span class="down">$1</span>')
    .replace(/(\+\d+%)/g, '<span class="up">$1</span>');

  let html = `<p class="headline">${headline}</p>`;
  if (d.detail) html += `<p class="detail">${esc(d.detail)}</p>`;

  if (d.signature) {
    html += `<div class="callout">
      <h3>${esc(d.signature.title)}</h3>
      <p>${esc(d.signature.body)}</p>
    </div>`;
  }

  if (d.recommendations.length) {
    html += `<p class="sub">What to do</p><div class="recs">${d.recommendations.map((r) => `
      <div class="rec ${esc(r.priority)}">
        <h4>${esc(r.title)} <span class="tag ${esc(r.priority)}">${esc(r.priority)}</span></h4>
        <p>${esc(r.body)}</p>
      </div>`).join('')}</div>`;
  }

  html += `<p class="sub">Evidence, ${d.window.postStart} to ${d.window.postEnd}</p>
    <table>
      <thead><tr>
        <th>Segment</th><th></th>
        <th class="num">Clicks</th><th class="num">Expected</th><th class="num">Change</th>
        <th class="num hide-sm">Impressions</th><th class="num hide-sm">Position</th>
        <th class="hide-sm">Reading</th>
      </tr></thead>
      <tbody>${d.findings.map((f) => `
        <tr>
          <td>${esc(f.name)}</td>
          <td>${verdictTag(f.verdict)}</td>
          <td class="num">${f.actualClicks.toLocaleString()}</td>
          <td class="num">${f.expectedClicks.toLocaleString()}</td>
          <td class="delta ${pctClass(f.clicksPct)}">${fmtPct(f.clicksPct)}</td>
          <td class="num hide-sm ${pctClass(f.imprPct)}">${fmtPct(f.imprPct)}</td>
          <td class="num hide-sm">${f.posDelta == null ? '-' : (f.posDelta > 0 ? '+' : '') + f.posDelta.toFixed(1)}</td>
          <td class="hide-sm" style="color:var(--muted)">${esc(f.diagnosis.label)}</td>
        </tr>`).join('')}</tbody>
    </table>
    <p class="chartnote">Expected is what each segment would have done had the rollout not happened,
      modelled from the same weekdays in the eight weeks before it began. A worsening position is a
      positive number, since position 3 is worse than position 1.</p>`;

  $('findings').innerHTML = html;
}

$('findUpdate').addEventListener('change', (e) =>
  loadFindings(e.target.value).catch((err) => toast(err.message)));

// ------------------------------------------------------------- segments

const seg = { propertyId: null, selected: null };

function pctClass(v) {
  if (v == null) return 'flat';
  if (v <= -5) return 'down';
  if (v >= 5) return 'up';
  return 'flat';
}

function fmtPct(v) {
  if (v == null) return '-';
  return `${v > 0 ? '+' : ''}${v.toFixed(1)}%`;
}

async function loadSegments() {
  if (!seg.propertyId) {
    $('segs').innerHTML = '<p class="empty">Activate a property first.</p>';
    return;
  }

  const metric = $('segMetric').value;
  const days = $('segDays').value;
  const d = await api(`/api/segments/overview?property_id=${seg.propertyId}&metric=${metric}&days=${days}`);

  if (!d.rows.length) {
    $('segs').innerHTML = `<p class="empty">No segments yet. Choose <b>Build segments</b> to
      derive page groups from this site's own structure and split queries by brand and intent.</p>`;
    $('chartWrap').hidden = true;
    return;
  }

  // Biggest movers first: a segment that held steady is rarely the story.
  const rows = [...d.rows].sort((a, b) =>
    Math.abs(b.deltaPct == null ? 0 : b.deltaPct) - Math.abs(a.deltaPct == null ? 0 : a.deltaPct));

  $('segs').innerHTML = `<table>
    <thead><tr>
      <th>Segment</th><th class="hide-sm">Type</th>
      <th class="num">Actual</th><th class="num">Expected</th>
      <th class="num">Change</th><th class="num hide-sm">Days outside range</th>
    </tr></thead>
    <tbody>${rows.map((r) => `
      <tr class="seg ${seg.selected === r.id ? 'sel' : ''}" data-seg="${r.id}">
        <td>${esc(r.name)}</td>
        <td class="hide-sm"><span class="tag">${esc(r.kind)}</span></td>
        <td class="num">${r.actual.toLocaleString()}</td>
        <td class="num">${r.expected == null ? '-' : Math.round(r.expected).toLocaleString()}</td>
        <td class="delta ${pctClass(r.deltaPct)}">${fmtPct(r.deltaPct)}</td>
        <td class="num hide-sm">${r.daysBelow + r.daysAbove} of ${r.days}</td>
      </tr>`).join('')}</tbody></table>
    <p class="chartnote">Expected is what this segment normally does on these weekdays,
      from the previous eight weeks. Select a row to see the daily detail.</p>`;

  if (seg.selected && rows.some((r) => r.id === seg.selected)) {
    await loadChart(seg.selected);
  }
}

/**
 * Actual against the expected range, with rollout windows shaded. Reading the
 * line against the band is the whole point: a drop inside the band is noise,
 * a drop below it needs explaining.
 */
function renderChart(d) {
  const pts = d.points.filter((p) => p.value != null);
  if (pts.length < 2) {
    $('chart').innerHTML = '<p class="empty">Not enough data to chart yet.</p>';
    return;
  }

  const W = 900, H = 260, L = 46, R = 12, T = 14, B = 26;
  const iw = W - L - R, ih = H - T - B;

  const values = [];
  pts.forEach((p) => {
    values.push(p.value);
    if (p.upper != null) values.push(p.upper);
    if (p.lower != null) values.push(p.lower);
  });
  const maxV = Math.max(...values, 1);
  const minV = Math.min(...values, 0);
  const span = (maxV - minV) || 1;

  const t0 = new Date(pts[0].date).getTime();
  const t1 = new Date(pts[pts.length - 1].date).getTime();
  const tspan = (t1 - t0) || 1;

  const x = (iso) => L + ((new Date(iso).getTime() - t0) / tspan) * iw;
  const y = (v) => T + ih - ((v - minV) / span) * ih;

  const banded = pts.filter((p) => p.upper != null);
  let band = '';
  if (banded.length > 1) {
    const top = banded.map((p) => `${x(p.date).toFixed(1)},${y(p.upper).toFixed(1)}`);
    const bottom = [...banded].reverse().map((p) => `${x(p.date).toFixed(1)},${y(p.lower).toFixed(1)}`);
    band = `<polygon points="${top.concat(bottom).join(' ')}" fill="var(--sand)" opacity="0.13"/>`;
  }

  const expectedLine = banded.length > 1
    ? `<polyline points="${banded.map((p) => `${x(p.date).toFixed(1)},${y(p.expected).toFixed(1)}`).join(' ')}"
        fill="none" stroke="var(--sand)" stroke-width="1" stroke-dasharray="3 3" opacity="0.65"/>`
    : '';

  const actualLine = `<polyline points="${pts.map((p) => `${x(p.date).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ')}"
      fill="none" stroke="var(--text)" stroke-width="1.6"/>`;

  const outliers = pts.filter((p) => p.status === 'below' || p.status === 'above')
    .map((p) => `<circle cx="${x(p.date).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="2.4"
      fill="${p.status === 'below' ? 'var(--err)' : 'var(--ok)'}"/>`).join('');

  const rollouts = (d.updates || []).map((u) => {
    const a = Math.max(x(u.began_at.slice(0, 10)), L);
    const b = Math.min(u.ended_at ? x(u.ended_at.slice(0, 10)) : L + iw, L + iw);
    if (b < L || a > L + iw) return '';
    const colour = u.update_type === 'spam' ? 'var(--err)' : 'var(--sand)';
    return `<rect x="${a.toFixed(1)}" y="${T}" width="${Math.max(b - a, 1.5).toFixed(1)}" height="${ih}"
      fill="${colour}" opacity="0.11"/>
      <line x1="${a.toFixed(1)}" y1="${T}" x2="${a.toFixed(1)}" y2="${T + ih}"
      stroke="${colour}" stroke-width="1" opacity="0.55"/>`;
  }).join('');

  const gridY = [0, 0.5, 1].map((f) => {
    const v = minV + span * f;
    return `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${L + iw}" y2="${y(v).toFixed(1)}"
        stroke="var(--line)" stroke-width="1"/>
      <text x="${L - 8}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end"
        fill="var(--muted)" font-size="10" font-family="ui-monospace,monospace">${Math.round(v).toLocaleString()}</text>`;
  }).join('');

  $('chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img"
      aria-label="${esc(d.segment.name)} ${esc(d.metric)} against its expected range">
    ${gridY}${rollouts}${band}${expectedLine}${actualLine}${outliers}
    <text x="${L}" y="${H - 8}" fill="var(--muted)" font-size="10"
      font-family="ui-monospace,monospace">${pts[0].date}</text>
    <text x="${L + iw}" y="${H - 8}" text-anchor="end" fill="var(--muted)" font-size="10"
      font-family="ui-monospace,monospace">${pts[pts.length - 1].date}</text>
  </svg>`;
}

async function loadChart(segmentId) {
  seg.selected = segmentId;
  const metric = $('segMetric').value;
  const d = await api(`/api/series?segment_id=${segmentId}&metric=${metric}&days=180`);

  $('chartWrap').hidden = false;
  $('chartTitle').textContent = `${d.segment.name} - daily ${d.metric} against expected range`;
  renderChart(d);

  const s = d.summary;
  const shaded = (d.updates || []).length;
  $('chartNote').innerHTML = s && s.expected != null
    ? `Last 28 days: <b>${s.actual.toLocaleString()}</b> ${esc(d.metric)} against an expected
       <b>${Math.round(s.expected).toLocaleString()}</b>
       (<b>${fmtPct(s.deltaPct)}</b>). ${s.daysBelow} days below the range, ${s.daysAbove} above.
       ${shaded ? `${shaded} ranking update rollout${shaded > 1 ? 's' : ''} shaded.` : ''}`
    : 'Not enough history yet to model an expected range for this segment.';
}

$('segs').addEventListener('click', (ev) => {
  const row = ev.target.closest('tr.seg');
  if (!row) return;
  document.querySelectorAll('tr.seg').forEach((r) => r.classList.remove('sel'));
  row.classList.add('sel');
  loadChart(parseInt(row.dataset.seg, 10)).catch((e) => toast(e.message));
});

$('segMetric').addEventListener('change', () => loadSegments().catch((e) => toast(e.message)));
$('segDays').addEventListener('change', () => loadSegments().catch((e) => toast(e.message)));

$('buildSegs').addEventListener('click', (e) => busy(e.target, 'Building', async () => {
  if (!seg.propertyId) return toast('Activate a property first.');
  const r = await api('/api/segments/auto', {
    method: 'POST',
    body: JSON.stringify({ property_id: seg.propertyId })
  });
  toast(`${r.created} segments built. Brand terms: ${r.brandTerms.join(', ')}`);
  await loadSegments();
}));

async function loadAll() {
  await Promise.all([loadStatus(), loadProps(), loadJobs(), loadUpdates()]);
  await Promise.all([
    loadOpportunities().catch(() => {}),
    loadPeople().catch(() => {}),
    loadUpdateList().catch(() => {}),
    loadSegments().catch(() => {})
  ]);
}

$('props').addEventListener('click', (ev) => {
  const t = ev.target.closest('button');
  if (!t) return;
  if (t.dataset.toggle) {
    busy(t, '...', async () => {
      await api(`/api/properties/${t.dataset.toggle}/toggle`, { method: 'POST' });
      await loadAll();
    });
  }
  if (t.dataset.backfill) {
    if (!confirm('Queue a 16 month backfill for this property? This runs in the background.')) return;
    busy(t, 'Queueing', async () => {
      const r = await api(`/api/properties/${t.dataset.backfill}/backfill`, { method: 'POST' });
      toast(`${r.queued} jobs queued`);
      await loadAll();
    });
  }
});

$('syncProps').addEventListener('click', (e) => busy(e.target, 'Looking', async () => {
  const r = await api('/api/properties/sync', { method: 'POST' });
  toast(`${r.found} readable, ${r.added} new`);
  await loadAll();
}));

$('refreshAll').addEventListener('click', (e) => busy(e.target, 'Queueing', async () => {
  const r = await api('/api/refresh', { method: 'POST' });
  toast(`${r.queued} jobs queued`);
  await loadAll();
}));

$('retryJobs').addEventListener('click', (e) => busy(e.target, 'Retrying', async () => {
  const r = await api('/api/jobs/retry', { method: 'POST' });
  toast(`${r.requeued} jobs requeued`);
  await loadAll();
}));

$('runTick').addEventListener('click', (e) => busy(e.target, 'Running', async () => {
  const r = await api('/api/tick?budget=25000', { method: 'POST' });
  if (!r.processed && !r.failed && !r.remaining) {
    toast('Nothing queued. Choose Backfill on a property first.');
  } else if (r.failed) {
    toast(`${r.processed} done, ${r.failed} failed, ${r.remaining} still queued`);
  } else {
    toast(`${r.processed} done, ${r.rows.toLocaleString()} rows, ${r.remaining} still queued`);
  }
  await loadAll();
}));

$('syncUpd').addEventListener('click', (e) => busy(e.target, 'Syncing', async () => {
  const r = await api('/api/updates/sync', { method: 'POST' });
  toast(`${r.written} ranking updates stored`);
  await loadAll();
}));

$('toggleManual').addEventListener('click', () => $('manualForm').classList.toggle('open'));

$('saveManual').addEventListener('click', (e) => busy(e.target, 'Saving', async () => {
  await api('/api/updates/manual', {
    method: 'POST',
    body: JSON.stringify({
      name: $('mName').value.trim(),
      began_at: $('mBegan').value,
      ended_at: $('mEnded').value || null,
      url: $('mUrl').value.trim() || null
    })
  });
  $('mName').value = ''; $('mBegan').value = ''; $('mEnded').value = ''; $('mUrl').value = '';
  $('manualForm').classList.remove('open');
  toast('Update saved');
  await loadAll();
}));


$('signout').addEventListener('click', async () => {
  await api('/api/logout', { method: 'POST' });
  location.reload();
});

(async function boot() {
  const s = await api('/api/session');
  if (!s.signedIn) {
    // The server serves the landing page to signed-out visitors, so reaching
    // here means the session expired mid-visit.
    location.href = '/';
    return;
  }
  $('app').hidden = false;
  $('who').textContent = s.email && s.email !== 'admin' ? s.email : '';
  if (s.owner) $('peopleSection').hidden = false;
  try {
    await loadAll();
  } catch (err) {
    toast(err.message);
  }
  setInterval(() => loadAll().catch(() => {}), 30000);
})();
</script>
</body>
</html>
